[tool.pytest.ini_options]
testpaths = ["services/biology-assessment-api/tests"]
pythonpath = [".", "services/biology-assessment-api"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/biology-assessment-api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
